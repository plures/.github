name: CI Workflow Drift Sweep

# Org-wide tripwire (ongoing, scheduled). Diffs every non-archived plures
# repo's .github/workflows/ci.yml against the canonical ci-reusable.yml
# template and flags:
#   - LOCAL     repos with a non-delegating (forked/local) ci.yml copy
#   - STALE_REF repos that delegate but are pinned to a ref other than @main
#
# This is the ONGOING sweep, not a one-time audit. The one-time 66-repo audit
# (github-actions:ci-lockin-reduction epic, PR plures/.github#21) found the
# starting baseline (20 repos with non-reusable ci.yml, 5 with non-reusable
# release.yml) and is the reference point this sweep watches for regressions
# and new drift against. Read-only against target repos; the only write is
# the tracking issue in plures/.github (same pattern as
# release-health-monitor.yml).
#
# Manual run: Actions -> CI Workflow Drift Sweep -> Run workflow.

on:
  schedule:
    - cron: '43 15 * * *'   # 15:43 UTC daily, offset from release-health-monitor's 15:17
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-drift-sweep
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (for the scan script)
        uses: actions/checkout@v4

      - name: Run CI drift scan
        id: scan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG: ${{ github.repository_owner }}
        run: |
          chmod +x .github/scripts/ci-drift-scan.sh
          .github/scripts/ci-drift-scan.sh | tee report.md

      - name: Open / update tracking issue on drift
        if: ${{ steps.scan.outputs.local_count != '0' || steps.scan.outputs.stale_count != '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="🔧 CI workflow drift: $((${{ steps.scan.outputs.local_count }}+0)) local, $((${{ steps.scan.outputs.stale_count }}+0)) stale-ref"
          BODY="$(cat report.md)"
          BODY="${BODY}$(printf '\n\n_Auto-generated by CI Workflow Drift Sweep. Updated in place each run; auto-closes when all repos delegate cleanly to ci-reusable.yml@main._')"
          existing=$(gh issue list --repo ${{ github.repository }} --state open --label ci-drift --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue edit "$existing" --repo ${{ github.repository }} --title "$TITLE" --body "$BODY"
            gh issue comment "$existing" --repo ${{ github.repository }} --body "Re-scanned $(date -u +%Y-%m-%dT%H:%MZ) — see updated body."
          else
            gh label create ci-drift --repo ${{ github.repository }} --color FBCA04 --description "Automated ci.yml drift-from-canonical tripwire" 2>/dev/null || true
            gh issue create --repo ${{ github.repository }} --title "$TITLE" --body "$BODY" --label ci-drift
          fi

      - name: Close tracking issue when clean
        if: ${{ steps.scan.outputs.local_count == '0' && steps.scan.outputs.stale_count == '0' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh issue list --repo ${{ github.repository }} --state open --label ci-drift --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh issue comment "$existing" --repo ${{ github.repository }} --body "✅ All ci.yml-bearing repos delegate cleanly to ci-reusable.yml@main as of $(date -u +%Y-%m-%dT%H:%MZ). Closing."
            gh issue close "$existing" --repo ${{ github.repository }}
          fi
