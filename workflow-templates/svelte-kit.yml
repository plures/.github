# SvelteKit / Svelte 5 CI template.
# Calls the org-wide reusable release workflow on push to main.
#
# CI: lint, type-check, test (Vitest + Playwright), build.
# Release: auto-detect version bump from conventional commits on push to main.

name: Svelte CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['20.x', '22.x']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --if-present

      - name: Check formatting
        run: npm run format:check --if-present

      - name: Type-check
        run: npm run check

      - name: Unit tests (Vitest)
        run: npm run test:unit --if-present

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
        if: hashFiles('playwright.config.*') != ''

      - name: Integration tests (Playwright)
        run: npm run test:integration --if-present
        if: hashFiles('playwright.config.*') != ''

      - name: Build
        run: npm run build

  release:
    name: Release
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: plures/.github/.github/workflows/release-reusable.yml@main
    with:
      bump: ''
    secrets: inherit
